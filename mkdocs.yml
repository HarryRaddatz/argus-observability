site_name: Argus
site_description: Observability for Docker hosts and workloads
site_url: https://harryraddatz.github.io/argus-observability/
repo_url: https://github.com/HarryRaddatz/argus-observability
repo_name: HarryRaddatz/argus-observability
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

hooks:
  - .github/pages/hooks.py

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt
          name: Português
          build: true
          nav_translations:
            Home: Início
            What's new: Novidades
            Get started: Começar
            Overview: Visão geral
            Deploy and upgrades: Deploy e atualização
            Product map: Mapa do produto
            API: API
            Configuration: Configuração
            Ingest: Ingest
            Query: Query
            Observability: Observability
            Flows: Fluxos
            Agent connection: Conexão do agent
            Metrics ingest: Ingestão de métricas
            Log streaming: Streaming de logs
            Events and alerts: Eventos e alertas
            Panel: Painel
            Project: Projeto
            Roadmap: Roadmap
            Contributing: Contribuir

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - What's new: changelog.md
  - Get started:
      - Overview: overview.md
      - Deploy and upgrades: deploy.md
      - Product map: map.md
  - API:
      - api/README.md
      - Configuration: api/configuration.md
      - Ingest: api/ingest.md
      - Query: api/query.md
      - Observability: api/observability.md
  - Flows:
      - Agent connection: flows/agent-connection.md
      - Metrics ingest: flows/metrics-ingestion.md
      - Log streaming: flows/log-streaming.md
      - Events and alerts: flows/events-and-alerts.md
      - Panel: flows/ui-panel.md
  - Project:
      - Roadmap: public-library/roadmap.md
      - Contributing: contributing.md
