# Stack mínima usando imagens publicadas (sem build local).
# Registry: ARGUS_REGISTRY=ghcr.io/harryraddatz (default) ou docker.io/pseudohuery.
# Releases: https://github.com/HarryRaddatz/argus-observability/releases

name: argus-minimal-published

services:
  argus-hub:
    image: ${ARGUS_REGISTRY:-ghcr.io/harryraddatz}/argus-hub:${ARGUS_VERSION:-latest}
    container_name: argus-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ARGUS_HUB_ADDR: ":8080"
      ARGUS_STORE_PATH: /data/argus.db
    volumes:
      - argus_data:/data

  argus-agent:
    image: ${ARGUS_REGISTRY:-ghcr.io/harryraddatz}/argus-agent:${ARGUS_VERSION:-latest}
    container_name: argus-agent
    restart: unless-stopped
    environment:
      ARGUS_HUB_URL: http://argus-hub:8080
      ARGUS_HOST_ID: demo-host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - argus-hub

  argus-web:
    image: ${ARGUS_REGISTRY:-ghcr.io/harryraddatz}/argus-web:${ARGUS_VERSION:-latest}
    container_name: argus-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - argus-hub

volumes:
  argus_data:
