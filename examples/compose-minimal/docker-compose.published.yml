# Stack mínima usando imagens publicadas (sem build local).
# Registry: ARGUS_REGISTRY=ghcr.io/harryraddatz (default) ou docker.io/pseudohuery.
# Releases: https://github.com/HarryRaddatz/argus-observability/releases

name: argus-minimal-published

services:
  argus-postgres:
    image: postgres:16-alpine
    container_name: argus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 5s
      timeout: 3s
      retries: 10

  argus-hub:
    image: ${ARGUS_REGISTRY:-ghcr.io/harryraddatz}/argus-hub:${ARGUS_VERSION:-latest}
    container_name: argus-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ARGUS_HUB_ADDR: ":8080"
      ARGUS_STORE_DRIVER: postgres
      ARGUS_STORE_DSN: postgres://argus:argus@argus-postgres:5432/argus?sslmode=disable
    depends_on:
      argus-postgres:
        condition: service_healthy

  argus-agent:
    image: ${ARGUS_REGISTRY:-ghcr.io/harryraddatz}/argus-agent:${ARGUS_VERSION:-latest}
    container_name: argus-agent
    restart: unless-stopped
    environment:
      ARGUS_HUB_URL: http://argus-hub:8080
      ARGUS_HOST_ID: demo-host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Tracepoint attachment reads the tracefs events directory.
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
    # Only needed when ARGUS_EBPF is enabled.
    cap_add:
      - BPF
      - PERFMON
      - SYS_ADMIN
    depends_on:
      - argus-hub

  argus-web:
    image: ${ARGUS_REGISTRY:-ghcr.io/harryraddatz}/argus-web:${ARGUS_VERSION:-latest}
    container_name: argus-web
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      ARGUS_AGENT_TOKEN: ${ARGUS_AGENT_TOKEN:-}
    depends_on:
      - argus-hub
