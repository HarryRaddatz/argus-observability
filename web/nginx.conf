server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://argus-hub:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /health {
    proxy_pass http://argus-hub:8080;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
