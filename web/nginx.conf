server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://argus-hub:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /health {
    proxy_pass http://argus-hub:8080;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Ingest de agents remotos: só as rotas POST autenticadas por Bearer no hub.
# As rotas GET do hub não têm auth e não passam por aqui.
server {
  listen 8081;
  client_max_body_size 8m;

  location ~ ^/(api/v1/(agents/(register|heartbeat)|metrics/batch|logs/batch|events|fleet/batch)|v1/traces)$ {
    limit_except POST { deny all; }
    proxy_pass http://argus-hub:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /health {
    proxy_pass http://argus-hub:8080;
  }

  location / {
    return 404;
  }
}
