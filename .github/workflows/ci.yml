name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-26.04
    outputs:
      hub: ${{ steps.filter.outputs.hub }}
      agent: ${{ steps.filter.outputs.agent }}
      web: ${{ steps.filter.outputs.web }}
      go: ${{ steps.filter.outputs.go }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: filter
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_ALL: ${{ github.ref_type == 'tag' || (github.event_name != 'pull_request' && github.event_name != 'push') }}
        run: bash .github/scripts/ci-changes.sh

  leak:
    name: anti-leak
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Anti-leak check
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/check-no-vps-leak.sh

  go:
    name: go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            echo '## Go coverage' >> "$GITHUB_STEP_SUMMARY"
            go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Go build
        run: go build ./cmd/...

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: docker (${{ matrix.component }})
    needs: [changes, go, web]
    if: >-
      !cancelled()
      && needs.changes.outputs.docker == 'true'
      && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: hub
            context: .
            file: Dockerfile.hub
          - component: agent
            context: .
            file: Dockerfile.agent
          - component: web
            context: ./web
            file: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs[matrix.component] == 'true'

      - uses: docker/setup-buildx-action@v4
        if: needs.changes.outputs[matrix.component] == 'true'

      - name: Build argus-${{ matrix.component }}
        if: needs.changes.outputs[matrix.component] == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=argus-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=argus-${{ matrix.component }}

  test:
    name: test
    if: always()
    needs: [changes, leak, go, web, docker]
    runs-on: ubuntu-26.04
    steps:
      - name: Require all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          echo "Results: $RESULTS"
          [ "$CHANGES" = "success" ] || { echo "CI failed: changes"; exit 1; }
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "CI failed"; exit 1 ;;
            esac
          done
