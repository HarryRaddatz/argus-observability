name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"

jobs:
  leak:
    name: anti-leak
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Anti-leak check
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/check-no-vps-leak.sh

  go:
    name: go
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Go build
        run: go build ./cmd/...

  web:
    name: web
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: docker (${{ matrix.component }})
    needs: [go, web]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: hub
            context: .
            file: Dockerfile.hub
          - component: agent
            context: .
            file: Dockerfile.agent
          - component: web
            context: ./web
            file: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build argus-${{ matrix.component }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=argus-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=argus-${{ matrix.component }}

  test:
    name: test
    if: always()
    needs: [leak, go, web, docker]
    runs-on: ubuntu-26.04
    steps:
      - name: Require all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "CI failed"; exit 1; }
          done
