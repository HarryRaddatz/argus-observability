name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-26.04
    outputs:
      hub: ${{ steps.filter.outputs.hub }}
      agent: ${{ steps.filter.outputs.agent }}
      web: ${{ steps.filter.outputs.web }}
      go: ${{ steps.filter.outputs.go }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: filter
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_ALL: ${{ github.ref_type == 'tag' || (github.event_name != 'pull_request' && github.event_name != 'push') }}
        run: bash .github/scripts/ci-changes.sh

  leak:
    name: anti-leak
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Anti-leak check
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/check-no-vps-leak.sh

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/ci-gitleaks.sh

  vuln-go:
    name: vuln-go
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  vuln-web:
    name: vuln-web
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  go:
    name: go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            echo '## Go coverage' >> "$GITHUB_STEP_SUMMARY"
            go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Go build
        run: go build ./cmd/...

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  docker:
    name: docker (${{ matrix.component }})
    needs: [changes, go, web]
    if: >-
      !cancelled()
      && needs.changes.outputs.docker == 'true'
      && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: hub
            context: .
            file: Dockerfile.hub
          - component: agent
            context: .
            file: Dockerfile.agent
          - component: web
            context: ./web
            file: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs[matrix.component] == 'true'

      - uses: docker/setup-buildx-action@v4
        if: needs.changes.outputs[matrix.component] == 'true'

      - name: Build argus-${{ matrix.component }}
        id: build
        if: needs.changes.outputs[matrix.component] == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: argus-${{ matrix.component }}:ci
          cache-from: type=gha,scope=argus-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=argus-${{ matrix.component }}

      - name: Trivy argus-${{ matrix.component }}
        if: needs.changes.outputs[matrix.component] == 'true'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" \
            --entrypoint /bin/sh \
            aquasec/trivy:0.58.1 \
            -c '
              set -e
              IMG="argus-${{ matrix.component }}:ci"
              trivy image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
                --format sarif --output /out/trivy.sarif "$IMG"
              trivy image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
                --format table --exit-code 1 "$IMG"
            '

      - name: Upload Trivy SARIF
        if: >-
          always()
          && needs.changes.outputs[matrix.component] == 'true'
          && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.component }}

  smoke:
    name: smoke
    needs: [changes, docker]
    if: >-
      !cancelled()
      && needs.changes.outputs.docker == 'true'
      && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Load argus-hub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.hub
          push: false
          load: true
          tags: argus-hub:ci
          cache-from: type=gha,scope=argus-hub
          cache-to: type=gha,mode=max,scope=argus-hub

      - name: Load argus-agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agent
          push: false
          load: true
          tags: argus-agent:ci
          cache-from: type=gha,scope=argus-agent
          cache-to: type=gha,mode=max,scope=argus-agent

      - name: Load argus-web
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          load: true
          tags: argus-web:ci
          cache-from: type=gha,scope=argus-web
          cache-to: type=gha,mode=max,scope=argus-web

      - name: Compose smoke
        run: bash .github/scripts/ci-smoke.sh

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-compose-logs
          path: smoke-compose-logs.txt
          if-no-files-found: ignore

      - name: Compose down
        if: always()
        run: docker compose -f .github/ci/docker-compose.smoke.yml down -v --remove-orphans || true

  test:
    name: test
    if: always()
    needs: [changes, leak, gitleaks, vuln-go, vuln-web, go, web, docker, smoke]
    runs-on: ubuntu-26.04
    steps:
      - name: Require all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          echo "Results: $RESULTS"
          [ "$CHANGES" = "success" ] || { echo "CI failed: changes"; exit 1; }
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "CI failed"; exit 1 ;;
            esac
          done
