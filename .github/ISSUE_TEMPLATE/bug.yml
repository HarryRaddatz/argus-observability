name: Bug
description: Something does not work as documented
title: "[bug] "
labels: [bug]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/HarryRaddatz/argus-observability/issues) first.
        Write in English. Do not paste tokens, `.env`, or private hosts.
        Vulnerability: [private advisory](https://github.com/HarryRaddatz/argus-observability/security/advisories/new), not this form.
  - type: checkboxes
    id: prior
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/HarryRaddatz/argus-observability/blob/main/CODE_OF_CONDUCT.md)
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Observed result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, compose, or command. No secrets or private hosts.
      placeholder: |
        1. docker compose up -d
        2. curl http://127.0.0.1:8080/health
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - hub
        - agent
        - web
        - compose / images
        - docs
        - CI
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Tag (`v0.3.0`) or commit SHA.
      placeholder: v0.3.0
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. Redact secrets.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Optional. Environment, related issues, screenshots.
