name: Bug
description: Something does not work as documented
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check whether the behavior is already described in the [docs](https://harryraddatz.github.io/argus-observability/).
        Vulnerability: use the [private advisory](https://github.com/HarryRaddatz/argus-observability/security/advisories/new), not this issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Observed result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, compose, or command. No secrets or private hosts.
      placeholder: |
        1. docker compose up -d
        2. curl ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - hub
        - agent
        - web
        - compose / images
        - docs
        - CI
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Tag (`v0.3.0`) or SHA.
      placeholder: v0.3.0
