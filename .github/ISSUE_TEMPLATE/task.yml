name: Task
description: CI, compose, chore, or other work that is not a bug or a feature
title: "[task] "
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Use this for CI, release, compose, or repo chores.
        Write in English. Bugs and product ideas have their own templates.
  - type: checkboxes
    id: prior
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/HarryRaddatz/argus-observability/blob/main/CODE_OF_CONDUCT.md)
          required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - hub
        - agent
        - web
        - compose / images
        - docs
        - CI
        - repo / GitHub
    validations:
      required: true
  - type: textarea
    id: accept
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ]
    validations:
      required: true
