name: Feature
description: Feature request or behavior change
title: "[feat] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Describe the problem for someone using Argus, not the implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected and what cannot be done today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Desired behavior. Out of scope, if any.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - hub
        - agent
        - web
        - compose / images
        - docs
        - CI
    validations:
      required: true
  - type: textarea
    id: accept
    attributes:
      label: Acceptance criteria
      description: What must be true to close the issue.
      placeholder: |
        - [ ]
