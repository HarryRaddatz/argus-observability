name: Documentation
description: Fix or gap in README, docs/, or CONTRIBUTING
title: "[docs] "
labels: [documentation]
body:
  - type: textarea
    id: where
    attributes:
      label: Where
      description: Path or URL of the page.
      placeholder: docs/api/configuration.md
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggest
    attributes:
      label: Suggested fix
      description: Optional.
