name: argus-smoke

services:
  argus-hub:
    image: argus-hub:ci
    pull_policy: never
    environment:
      ARGUS_HUB_ADDR: ":8080"
      ARGUS_STORE_PATH: /data/argus.db
      ARGUS_RETENTION_LOGS: "72h"
      ARGUS_RETENTION_METRICS: "168h"
      ARGUS_RETENTION_EVENTS: "720h"
      ARGUS_PURGE_INTERVAL: "10m"
      ARGUS_PURGE_TIMEOUT: "30s"
      ARGUS_INGEST_CONCURRENCY: "8"
      GOMEMLIMIT: "160MiB"
    volumes:
      - argus_smoke_data:/data
    ports:
      - "8080:8080"

  argus-agent:
    image: argus-agent:ci
    pull_policy: never
    environment:
      ARGUS_HUB_URL: http://argus-hub:8080
      ARGUS_AGENT_ID: argus-agent
      ARGUS_HOST_ID: ci-smoke
      ARGUS_COLLECT_INTERVAL: 5s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      argus-hub:
        condition: service_started

  argus-web:
    image: argus-web:ci
    pull_policy: never
    ports:
      - "3000:80"
    depends_on:
      - argus-hub

  example-app:
    image: alpine:3.21
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          echo '{"level":"info","msg":"smoke","method":"GET","path":"/health","status":200}'
          sleep 1
        done

volumes:
  argus_smoke_data:
