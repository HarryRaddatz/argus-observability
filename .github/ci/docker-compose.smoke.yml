name: argus-smoke

services:
  argus-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 5s
      timeout: 3s
      retries: 10

  argus-hub:
    image: argus-hub:ci
    pull_policy: never
    environment:
      ARGUS_HUB_ADDR: ":8080"
      ARGUS_STORE_DRIVER: postgres
      ARGUS_STORE_DSN: postgres://argus:argus@argus-postgres:5432/argus?sslmode=disable
      ARGUS_RETENTION_LOGS: "72h"
      ARGUS_RETENTION_METRICS: "168h"
      ARGUS_RETENTION_EVENTS: "720h"
      ARGUS_PURGE_INTERVAL: "10m"
      ARGUS_PURGE_TIMEOUT: "30s"
      ARGUS_INGEST_CONCURRENCY: "8"
      GOMEMLIMIT: "160MiB"
    ports:
      - "8080:8080"
    depends_on:
      argus-postgres:
        condition: service_healthy

  argus-agent:
    image: argus-agent:ci
    pull_policy: never
    environment:
      ARGUS_HUB_URL: http://argus-hub:8080
      ARGUS_AGENT_ID: argus-agent
      ARGUS_HOST_ID: ci-smoke
      ARGUS_COLLECT_INTERVAL: 5s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      argus-hub:
        condition: service_started

  argus-web:
    image: argus-web:ci
    pull_policy: never
    environment:
      ARGUS_AGENT_TOKEN: ""
    ports:
      - "3000:80"
    depends_on:
      - argus-hub

  example-app:
    image: alpine:3.21
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          echo '{"level":"info","msg":"smoke","method":"GET","path":"/health","status":200}'
          sleep 1
        done
